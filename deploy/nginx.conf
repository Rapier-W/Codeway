# 生产边缘配置（HTTPS 强制）。
# 运行前需将证书放到 deploy/certs/：
#   fullchain.pem -> /etc/nginx/certs/fullchain.pem
#   privkey.pem   -> /etc/nginx/certs/privkey.pem
# 备案/证书就绪前做试点，可改用 deploy/nginx.http-only.conf（仅 HTTP，见 docker-compose.prod.yml 注释）。

upstream api_backend {
    server api:3000;
    keepalive 32;
}

# HTTP：ACME 校验目录 + 全站 301 跳转 HTTPS
server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # 安全响应头
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    root /usr/share/nginx/html;
    index index.html;

    # API 反向代理到 NestJS（后端 global prefix 已是 /api，路径原样转发）。
    location /api/ {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Cookie $http_cookie;
    }

    # 预留：WebSocket（当前未启用；部署 Socket.IO 时取消注释并放行 Upgrade）。
    # location /socket.io/ {
    #     proxy_pass http://api_backend;
    #     proxy_http_version 1.1;
    #     proxy_set_header Upgrade $http_upgrade;
    #     proxy_set_header Connection "upgrade";
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # }

    # SPA 路由回退（PWA）
    location / {
        try_files $uri $uri/ /index.html;
    }
}
